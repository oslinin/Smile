[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Disables local disk caching of remote RPC data during network forking
no_storage_caching = true
# Prevents Anvil/Forge from writing persistent state histories to the disk
no_persistence = true
