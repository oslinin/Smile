<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Smile — Knowledge Graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
  }
  header {
    grid-column: 1 / -1;
    padding: 10px 16px;
    background: #161922;
    border-bottom: 1px solid #262a36;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { font-size: 12px; color: #8a8f9c; }
  #sidebar, #details {
    overflow-y: auto;
    padding: 14px;
    border-right: 1px solid #262a36;
  }
  #details { border-right: none; border-left: 1px solid #262a36; }
  section { margin-bottom: 20px; }
  section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #8a8f9c;
    margin: 0 0 8px;
  }
  #search {
    width: 100%;
    padding: 7px 9px;
    border-radius: 6px;
    border: 1px solid #2c3140;
    background: #1b1e27;
    color: #e6e6e6;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .layer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    cursor: pointer;
  }
  .layer-swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .layer-count { margin-left: auto; color: #8a8f9c; font-size: 11px; }
  .tour-step {
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .tour-step:hover { background: #1b1e27; border-color: #2c3140; }
  .tour-step b { color: #cfd3dc; }
  #graph-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0f1115; }
  #network { width: 100%; height: 100%; display: block; cursor: grab; }
  #network.dragging { cursor: grabbing; }
  #zoom-controls { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
  #zoom-controls button {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid #2c3140;
    background: #1b1e27; color: #e6e6e6; font-size: 15px; cursor: pointer;
  }
  #zoom-controls button:hover { background: #262a36; }
  #details .empty { color: #6b7080; font-size: 13px; line-height: 1.5; }
  #details h3 { font-size: 14px; margin: 0 0 4px; word-break: break-word; }
  #details .path { font-size: 11.5px; color: #8a8f9c; margin-bottom: 10px; word-break: break-all; }
  #details p { font-size: 13px; line-height: 1.5; color: #d3d6de; }
  .tag {
    display: inline-block;
    font-size: 10.5px;
    padding: 2px 7px;
    margin: 2px 4px 0 0;
    border-radius: 999px;
    background: #1b1e27;
    border: 1px solid #2c3140;
    color: #a9adb8;
  }
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: #2c3140; border-radius: 5px; }
</style>
</head>
<body>
<header>
  <h1>🧠 Smile — Knowledge Graph</h1>
  <span class="meta" id="proj-meta">loading…</span>
</header>
<div id="sidebar">
  <section>
    <h2>Search</h2>
    <input id="search" type="text" placeholder="Filter nodes by name or path…" />
  </section>
  <section>
    <h2>Layers</h2>
    <div id="layers"></div>
  </section>
  <section>
    <h2>Guided Tour</h2>
    <div id="tour"></div>
  </section>
</div>
<div id="graph-wrap">
  <canvas id="network"></canvas>
  <div id="zoom-controls">
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-reset" title="Reset view">⟲</button>
  </div>
</div>
<div id="details">
  <div class="empty">Click a node in the graph (or a tour step) to see its summary, file path, and tags here. Drag the background to pan, scroll to zoom, drag a node to reposition it.</div>
</div>

<script>
// Self-contained force-directed graph renderer — no external libraries or
// CDN dependencies, so it works fully offline.
const DATA_URL = './knowledge-graph.json';
const PALETTE = ['#5b8ff9', '#61ddaa', '#f6bd16', '#f6903d', '#e8684a', '#9270ca', '#6dc8ec', '#ff9d4d'];

const canvas = document.getElementById('network');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('graph-wrap');

let nodes = [];      // {id, x, y, vx, vy, r, color, label, layerId, hidden, fixed, raw}
let edges = [];      // {source, target}
let nodeById = new Map();
let selectedId = null;
const hiddenLayers = new Set();
let searchQuery = '';

const view = { x: 0, y: 0, scale: 1 }; // pan/zoom (screen = world*scale + offset)
let dragTarget = null;   // node being dragged
let panning = false;
let lastMouse = { x: 0, y: 0 };
let downMouse = { x: 0, y: 0 };
let moved = false;

fetch(DATA_URL)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(init)
  .catch(err => {
    document.getElementById('proj-meta').textContent = 'failed to load';
    wrap.innerHTML =
      `<div style="padding:40px;color:#e8684a;font-size:14px;max-width:640px">
        Could not load <code>knowledge-graph.json</code> (${err.message}).<br><br>
        This page must be served over HTTP, not opened as a local file —
        run <code>./view-knowledge-graph.sh</code> from the repo root, or
        regenerate the graph if <code>.understand-anything/knowledge-graph.json</code> is missing.
      </div>`;
  });

function init(data) {
  const p = data.project || {};
  document.getElementById('proj-meta').textContent =
    `${p.name || ''} · ${data.nodes.length} nodes · ${data.edges.length} edges · ` +
    `${(data.layers || []).length} layers · analyzed ${p.analyzedAt ? new Date(p.analyzedAt).toLocaleDateString() : '?'}`;

  const layerColor = {};
  (data.layers || []).forEach((l, i) => { layerColor[l.id] = PALETTE[i % PALETTE.length]; });
  const nodeLayer = {};
  (data.layers || []).forEach(l => (l.nodeIds || []).forEach(id => (nodeLayer[id] = l.id)));

  const cx = 0, cy = 0, radius = Math.sqrt(data.nodes.length) * 40;
  nodes = data.nodes.map((n, i) => {
    const angle = (i / data.nodes.length) * Math.PI * 2;
    return {
      id: n.id,
      label: n.name || n.id,
      x: cx + Math.cos(angle) * radius * (0.4 + Math.random() * 0.6),
      y: cy + Math.sin(angle) * radius * (0.4 + Math.random() * 0.6),
      vx: 0, vy: 0,
      r: n.type === 'file' ? 6 : 4,
      color: layerColor[nodeLayer[n.id]] || '#5f6472',
      layerId: nodeLayer[n.id] || null,
      hidden: false,
      fixed: false,
      raw: n,
    };
  });
  nodeById = new Map(nodes.map(n => [n.id, n]));

  edges = data.edges
    .filter(e => nodeById.has(e.source) && nodeById.has(e.target))
    .map(e => ({ source: e.source, target: e.target }));

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  resetView();

  wireInteraction();
  renderLayers(data.layers || []);
  renderTour(data.tour || []);
  wireSearch();

  requestAnimationFrame(tick);
}

// ---------- physics ----------
function step() {
  const repelStrength = 2200;
  const springStrength = 0.02;
  const springLength = 70;
  const centerPull = 0.0025;
  const damping = 0.85;

  // repulsion (all pairs — fine at this graph size)
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    if (a.fixed) continue;
    let fx = 0, fy = 0;
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) d2 = 1;
      const f = repelStrength / d2;
      const d = Math.sqrt(d2);
      fx += (dx / d) * f;
      fy += (dy / d) * f;
    }
    fx -= a.x * centerPull;
    fy -= a.y * centerPull;
    a.vx = (a.vx + fx) * damping;
    a.vy = (a.vy + fy) * damping;
  }

  // springs along edges
  for (const e of edges) {
    const a = nodeById.get(e.source), b = nodeById.get(e.target);
    if (!a || !b) continue;
    let dx = b.x - a.x, dy = b.y - a.y;
    let d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - springLength) * springStrength;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    if (!a.fixed) { a.vx += fx; a.vy += fy; }
    if (!b.fixed) { b.vx -= fx; b.vy -= fy; }
  }

  for (const n of nodes) {
    if (n.fixed) continue;
    n.x += n.vx * 0.06;
    n.y += n.vy * 0.06;
  }
}

let settleFrames = 260;
function tick() {
  if (settleFrames > 0 || dragTarget) { step(); if (settleFrames > 0) settleFrames--; }
  draw();
  requestAnimationFrame(tick);
}

// ---------- rendering ----------
function resizeCanvas() {
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resetView() {
  const rect = wrap.getBoundingClientRect();
  view.scale = 1;
  view.x = rect.width / 2;
  view.y = rect.height / 2;
}

function worldToScreen(x, y) { return [x * view.scale + view.x, y * view.scale + view.y]; }
function screenToWorld(x, y) { return [(x - view.x) / view.scale, (y - view.y) / view.scale]; }

function isVisible(n) {
  if (n.hidden) return false;
  if (hiddenLayers.has(n.layerId)) return false;
  if (searchQuery) {
    const hay = (n.label + ' ' + (n.raw.filePath || '')).toLowerCase();
    if (!hay.includes(searchQuery)) return false;
  }
  return true;
}

function draw() {
  const rect = wrap.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);

  ctx.lineWidth = 1;
  for (const e of edges) {
    const a = nodeById.get(e.source), b = nodeById.get(e.target);
    if (!a || !b || !isVisible(a) || !isVisible(b)) continue;
    const [ax, ay] = worldToScreen(a.x, a.y);
    const [bx, by] = worldToScreen(b.x, b.y);
    ctx.strokeStyle = 'rgba(80,88,110,0.35)';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(bx, by);
    ctx.stroke();
  }

  for (const n of nodes) {
    if (!isVisible(n)) continue;
    const [sx, sy] = worldToScreen(n.x, n.y);
    const r = n.r * Math.min(1.6, Math.max(0.6, view.scale));
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = n.color;
    ctx.fill();
    if (n.id === selectedId) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }
    if (view.scale > 0.6) {
      ctx.fillStyle = '#cfd3dc';
      ctx.font = '11px sans-serif';
      ctx.fillText(n.label, sx + r + 4, sy + 3);
    }
  }
}

// ---------- interaction ----------
function nodeAtScreen(sx, sy) {
  const [wx, wy] = screenToWorld(sx, sy);
  let best = null, bestD = Infinity;
  for (const n of nodes) {
    if (!isVisible(n)) continue;
    const dx = n.x - wx, dy = n.y - wy;
    const d = Math.sqrt(dx * dx + dy * dy);
    const hitR = Math.max(n.r, 8 / view.scale);
    if (d <= hitR && d < bestD) { best = n; bestD = d; }
  }
  return best;
}

function wireInteraction() {
  canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    downMouse = { x: sx, y: sy };
    lastMouse = { x: sx, y: sy };
    moved = false;
    const hit = nodeAtScreen(sx, sy);
    if (hit) {
      dragTarget = hit;
      hit.fixed = true;
    } else {
      panning = true;
      canvas.classList.add('dragging');
    }
  });

  window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const dx = sx - lastMouse.x, dy = sy - lastMouse.y;
    if (Math.abs(sx - downMouse.x) > 3 || Math.abs(sy - downMouse.y) > 3) moved = true;

    if (dragTarget) {
      const [wx, wy] = screenToWorld(sx, sy);
      dragTarget.x = wx; dragTarget.y = wy;
      dragTarget.vx = 0; dragTarget.vy = 0;
    } else if (panning) {
      view.x += dx; view.y += dy;
    }
    lastMouse = { x: sx, y: sy };
  });

  window.addEventListener('mouseup', e => {
    if (dragTarget && !moved) {
      // treat as click
      selectNode(dragTarget);
    } else if (!dragTarget && !moved) {
      const rect = canvas.getBoundingClientRect();
      const hit = nodeAtScreen(e.clientX - rect.left, e.clientY - rect.top);
      if (hit) selectNode(hit);
    }
    if (dragTarget) dragTarget.fixed = false;
    dragTarget = null;
    panning = false;
    canvas.classList.remove('dragging');
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    const [wx, wy] = screenToWorld(sx, sy);
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    view.scale = Math.min(4, Math.max(0.15, view.scale * factor));
    view.x = sx - wx * view.scale;
    view.y = sy - wy * view.scale;
  }, { passive: false });

  document.getElementById('zoom-in').addEventListener('click', () => zoomBy(1.25));
  document.getElementById('zoom-out').addEventListener('click', () => zoomBy(1 / 1.25));
  document.getElementById('zoom-reset').addEventListener('click', resetView);
}

function zoomBy(factor) {
  const rect = wrap.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const [wx, wy] = screenToWorld(cx, cy);
  view.scale = Math.min(4, Math.max(0.15, view.scale * factor));
  view.x = cx - wx * view.scale;
  view.y = cy - wy * view.scale;
}

function focusNode(n) {
  const rect = wrap.getBoundingClientRect();
  view.scale = Math.max(view.scale, 1.3);
  view.x = rect.width / 2 - n.x * view.scale;
  view.y = rect.height / 2 - n.y * view.scale;
}

function selectNode(n) {
  selectedId = n.id;
  focusNode(n);
  showDetails(n.raw);
}

// ---------- sidebar ----------
function renderLayers(layers) {
  const el = document.getElementById('layers');
  el.innerHTML = '';
  layers.forEach((l, i) => {
    const color = PALETTE[i % PALETTE.length];
    const row = document.createElement('div');
    row.className = 'layer-row';
    row.innerHTML = `<span class="layer-swatch" style="background:${color}"></span>
      <span>${l.name}</span><span class="layer-count">${(l.nodeIds || []).length}</span>`;
    row.title = l.description || '';
    row.addEventListener('click', () => toggleLayer(l.id, row));
    el.appendChild(row);
  });
}

function toggleLayer(layerId, row) {
  if (hiddenLayers.has(layerId)) {
    hiddenLayers.delete(layerId);
    row.style.opacity = 1;
  } else {
    hiddenLayers.add(layerId);
    row.style.opacity = 0.35;
  }
}

function renderTour(tour) {
  const el = document.getElementById('tour');
  el.innerHTML = '';
  tour
    .slice()
    .sort((a, b) => (a.order || 0) - (b.order || 0))
    .forEach(step => {
      const div = document.createElement('div');
      div.className = 'tour-step';
      div.innerHTML = `<b>${step.order}. ${step.title || ''}</b>`;
      div.addEventListener('click', () => {
        const targetId = step.nodeId || (step.nodeIds && step.nodeIds[0]);
        const n = targetId ? nodeById.get(targetId) : null;
        if (n) {
          selectNode(n);
        } else {
          showTourStep(step);
        }
      });
      el.appendChild(div);
    });
}

function showDetails(node) {
  const el = document.getElementById('details');
  const tags = (node.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  el.innerHTML = `
    <h3>${node.name || node.id}</h3>
    <div class="path">${node.filePath || node.type}</div>
    <p>${node.summary || '<em>No summary.</em>'}</p>
    <div>${tags}</div>
  `;
}

function showTourStep(step) {
  const el = document.getElementById('details');
  el.innerHTML = `
    <h3>${step.order}. ${step.title || ''}</h3>
    <p>${step.description || ''}</p>
  `;
}

function wireSearch() {
  const input = document.getElementById('search');
  input.addEventListener('input', () => {
    searchQuery = input.value.trim().toLowerCase();
  });
}
</script>
</body>
</html>
