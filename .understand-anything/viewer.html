<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Smile — Knowledge Graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/vis-network.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/vis-network.min.css" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: grid;
    grid-template-columns: 320px 1fr 340px;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
  }
  header {
    grid-column: 1 / -1;
    padding: 10px 16px;
    background: #161922;
    border-bottom: 1px solid #262a36;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { font-size: 12px; color: #8a8f9c; }
  #sidebar, #details {
    overflow-y: auto;
    padding: 14px;
    border-right: 1px solid #262a36;
  }
  #details { border-right: none; border-left: 1px solid #262a36; }
  section { margin-bottom: 20px; }
  section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #8a8f9c;
    margin: 0 0 8px;
  }
  #search {
    width: 100%;
    padding: 7px 9px;
    border-radius: 6px;
    border: 1px solid #2c3140;
    background: #1b1e27;
    color: #e6e6e6;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .layer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
    cursor: pointer;
  }
  .layer-swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .layer-count { margin-left: auto; color: #8a8f9c; font-size: 11px; }
  .tour-step {
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .tour-step:hover { background: #1b1e27; border-color: #2c3140; }
  .tour-step b { color: #cfd3dc; }
  #network { width: 100%; height: 100%; background: #0f1115; }
  #details .empty { color: #6b7080; font-size: 13px; line-height: 1.5; }
  #details h3 { font-size: 14px; margin: 0 0 4px; word-break: break-word; }
  #details .path { font-size: 11.5px; color: #8a8f9c; margin-bottom: 10px; word-break: break-all; }
  #details p { font-size: 13px; line-height: 1.5; color: #d3d6de; }
  .tag {
    display: inline-block;
    font-size: 10.5px;
    padding: 2px 7px;
    margin: 2px 4px 0 0;
    border-radius: 999px;
    background: #1b1e27;
    border: 1px solid #2c3140;
    color: #a9adb8;
  }
  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: #2c3140; border-radius: 5px; }
</style>
</head>
<body>
<header>
  <h1>🧠 Smile — Knowledge Graph</h1>
  <span class="meta" id="proj-meta">loading…</span>
</header>
<div id="sidebar">
  <section>
    <h2>Search</h2>
    <input id="search" type="text" placeholder="Filter nodes by name or path…" />
  </section>
  <section>
    <h2>Layers</h2>
    <div id="layers"></div>
  </section>
  <section>
    <h2>Guided Tour</h2>
    <div id="tour"></div>
  </section>
</div>
<div id="network"></div>
<div id="details">
  <div class="empty">Click a node in the graph (or a tour step) to see its summary, file path, and tags here.</div>
</div>

<script>
const DATA_URL = './knowledge-graph.json';
const PALETTE = ['#5b8ff9', '#61ddaa', '#f6bd16', '#f6903d', '#e8684a', '#9270ca', '#6dc8ec', '#ff9d4d'];

let network, nodesDS, edgesDS, graphData;
const hiddenLayers = new Set();

fetch(DATA_URL)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(init)
  .catch(err => {
    document.getElementById('proj-meta').textContent = 'failed to load';
    document.getElementById('network').innerHTML =
      `<div style="padding:40px;color:#e8684a;font-size:14px;max-width:640px">
        Could not load <code>knowledge-graph.json</code> (${err.message}).<br><br>
        This page must be served over HTTP, not opened as a local file —
        run <code>./view-knowledge-graph.sh</code> from the repo root, or
        regenerate the graph if <code>.understand-anything/knowledge-graph.json</code> is missing.
      </div>`;
  });

function init(data) {
  graphData = data;
  const p = data.project || {};
  document.getElementById('proj-meta').textContent =
    `${p.name || ''} · ${data.nodes.length} nodes · ${data.edges.length} edges · ` +
    `${(data.layers || []).length} layers · analyzed ${p.analyzedAt ? new Date(p.analyzedAt).toLocaleDateString() : '?'}`;

  const layerColor = {};
  (data.layers || []).forEach((l, i) => { layerColor[l.id] = PALETTE[i % PALETTE.length]; });
  const nodeLayer = {};
  (data.layers || []).forEach(l => (l.nodeIds || []).forEach(id => (nodeLayer[id] = l.id)));

  const visNodes = data.nodes.map(n => ({
    id: n.id,
    label: n.name || n.id,
    title: n.filePath || n.id,
    shape: n.type === 'file' ? 'dot' : 'diamond',
    size: n.type === 'file' ? 10 : 6,
    color: layerColor[nodeLayer[n.id]] || '#5f6472',
    group: nodeLayer[n.id] || 'ungrouped',
    raw: n,
  }));
  const visEdges = data.edges.map((e, i) => ({
    id: i,
    from: e.source,
    to: e.target,
    arrows: 'to',
    color: { color: '#2c3140', opacity: 0.55 },
    width: Math.max(1, (e.weight || 1) * 1.2),
    smooth: { type: 'continuous' },
  }));

  nodesDS = new vis.DataSet(visNodes);
  edgesDS = new vis.DataSet(visEdges);

  network = new vis.Network(
    document.getElementById('network'),
    { nodes: nodesDS, edges: edgesDS },
    {
      autoResize: true,
      interaction: { hover: true, tooltipDelay: 120 },
      physics: {
        solver: 'forceAtlas2Based',
        forceAtlas2Based: { gravitationalConstant: -60, springLength: 90, springConstant: 0.06 },
        stabilization: { iterations: 150 },
      },
      nodes: { font: { color: '#cfd3dc', size: 11 }, borderWidth: 1 },
      edges: { arrows: { to: { scaleFactor: 0.4 } } },
    }
  );

  network.on('click', params => {
    if (params.nodes.length) showDetails(nodesDS.get(params.nodes[0]).raw);
  });

  renderLayers(data.layers || []);
  renderTour(data.tour || []);
  wireSearch(data.nodes);
}

function renderLayers(layers) {
  const el = document.getElementById('layers');
  el.innerHTML = '';
  layers.forEach((l, i) => {
    const color = PALETTE[i % PALETTE.length];
    const row = document.createElement('div');
    row.className = 'layer-row';
    row.innerHTML = `<span class="layer-swatch" style="background:${color}"></span>
      <span>${l.name}</span><span class="layer-count">${(l.nodeIds || []).length}</span>`;
    row.title = l.description || '';
    row.addEventListener('click', () => toggleLayer(l.id, row));
    el.appendChild(row);
  });
}

function toggleLayer(layerId, row) {
  if (hiddenLayers.has(layerId)) {
    hiddenLayers.delete(layerId);
    row.style.opacity = 1;
  } else {
    hiddenLayers.add(layerId);
    row.style.opacity = 0.35;
  }
  const updates = nodesDS.get().map(n => ({
    id: n.id,
    hidden: hiddenLayers.has(n.group),
  }));
  nodesDS.update(updates);
}

function renderTour(tour) {
  const el = document.getElementById('tour');
  el.innerHTML = '';
  tour
    .slice()
    .sort((a, b) => (a.order || 0) - (b.order || 0))
    .forEach(step => {
      const div = document.createElement('div');
      div.className = 'tour-step';
      div.innerHTML = `<b>${step.order}. ${step.title || ''}</b>`;
      div.addEventListener('click', () => {
        const targetId = step.nodeId || step.nodeIds?.[0];
        if (targetId && nodesDS.get(targetId)) {
          network.selectNodes([targetId]);
          network.focus(targetId, { scale: 1.2, animation: true });
          showDetails(nodesDS.get(targetId).raw);
        } else {
          showTourStep(step);
        }
      });
      el.appendChild(div);
    });
}

function showDetails(node) {
  const el = document.getElementById('details');
  const tags = (node.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  el.innerHTML = `
    <h3>${node.name || node.id}</h3>
    <div class="path">${node.filePath || node.type}</div>
    <p>${node.summary || '<em>No summary.</em>'}</p>
    <div>${tags}</div>
  `;
}

function showTourStep(step) {
  const el = document.getElementById('details');
  el.innerHTML = `
    <h3>${step.order}. ${step.title || ''}</h3>
    <p>${step.description || ''}</p>
  `;
}

function wireSearch(nodes) {
  const input = document.getElementById('search');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) {
      nodesDS.update(nodesDS.get().map(n => ({ id: n.id, hidden: hiddenLayers.has(n.group) })));
      return;
    }
    const matches = new Set(
      nodes
        .filter(n => (n.name || '').toLowerCase().includes(q) || (n.filePath || '').toLowerCase().includes(q))
        .map(n => n.id)
    );
    nodesDS.update(nodesDS.get().map(n => ({ id: n.id, hidden: !matches.has(n.id) })));
  });
}
</script>
</body>
</html>
